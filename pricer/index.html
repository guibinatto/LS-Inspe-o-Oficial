<title>LS Pricer</title>
<meta name="description" content="Formação de preço LS Fire: equipamentos (SEQ), serviços e pós-venda (SPV), documentos de fornecedores e cadastros.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --or:#E8570A; --or-ink:#B8440A; --or-soft:#FFF1E8; --or-line:#F6C9AE;
  --ink:#1B1C1E; --ink2:#4E5157; --ink3:#83868C; --line:#E4E2DE; --line2:#D2CFC9;
  --bg:#F4F3F0; --card:#FFFFFF; --bar:#1E1F21; --bar-ink:#F1EFEA; --bar-dim:#9C9EA3;
  --entry:#FFF7DD; --entry-line:#EBD58C; --auto:#EDF5F0; --auto-line:#BFD9C8; --auto-ink:#2F6B46;
  --ok:#1E7A45; --ok-bg:#E6F4EC; --bad:#B42F22; --bad-bg:#FCEBE8; --warn:#9A6200; --warn-bg:#FDF4DE;
  --shadow:0 1px 2px rgba(30,20,10,.06),0 2px 8px rgba(30,20,10,.05); --th-bg:#EFEDE9; --row-h:#FBF8F4;
  --f-body:"Barlow",Arial,Helvetica,sans-serif; --f-cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --or:#FF7A33; --or-ink:#FF9A62; --or-soft:#3A2418; --or-line:#6B3A20;
  --ink:#ECEAE6; --ink2:#B9B6B0; --ink3:#8A8781; --line:#34332F; --line2:#46443F;
  --bg:#161615; --card:#1F1F1D; --bar:#0E0E0D; --bar-ink:#F1EFEA; --bar-dim:#8E8C87;
  --entry:#35301B; --entry-line:#6A5B24; --auto:#1B2B22; --auto-line:#2F5140; --auto-ink:#8CD3A8;
  --ok:#6FCF97; --ok-bg:#16301F; --bad:#FF8A7A; --bad-bg:#3A1B17; --warn:#F2C04E; --warn-bg:#352A12;
  --shadow:0 1px 2px rgba(0,0,0,.4); --th-bg:#272623; --row-h:#24231F;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --or:#FF7A33; --or-ink:#FF9A62; --or-soft:#3A2418; --or-line:#6B3A20;
  --ink:#ECEAE6; --ink2:#B9B6B0; --ink3:#8A8781; --line:#34332F; --line2:#46443F;
  --bg:#161615; --card:#1F1F1D; --bar:#0E0E0D; --bar-ink:#F1EFEA; --bar-dim:#8E8C87;
  --entry:#35301B; --entry-line:#6A5B24; --auto:#1B2B22; --auto-line:#2F5140; --auto-ink:#8CD3A8;
  --ok:#6FCF97; --ok-bg:#16301F; --bad:#FF8A7A; --bad-bg:#3A1B17; --warn:#F2C04E; --warn-bg:#352A12;
  --shadow:0 1px 2px rgba(0,0,0,.4); --th-bg:#272623; --row-h:#24231F;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--or);outline-offset:1px}

/* estrutura: menu lateral + barra superior + conteúdo */
.shell{display:flex;min-height:100vh}
.sidenav{position:sticky;top:0;height:100vh;flex:0 0 236px;width:236px;background:var(--bar);color:var(--bar-ink);display:flex;flex-direction:column;z-index:30;transition:width .18s ease,flex-basis .18s ease}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-cond);font-weight:700;font-size:21px;letter-spacing:.02em;min-width:0}
.brand .bt{color:var(--or);white-space:nowrap}
.logo-plate{display:flex;align-items:center;background:transparent;border-radius:8px;padding:0;flex:0 0 auto}
.logo-plate.custom{background:#fff;padding:3px 8px}
.logo-plate img{display:block;height:30px;width:auto}
.brand small{font-weight:500;font-size:11px;color:var(--bar-dim);letter-spacing:.08em;text-transform:uppercase;margin-left:4px}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;flex:1 1 auto;overflow:auto}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--bar-dim);font-family:var(--f-cond);font-weight:600;font-size:15.5px;letter-spacing:.04em;text-transform:uppercase;padding:9px 12px;border-radius:9px;cursor:pointer;text-align:left;position:relative;transition:background .15s ease,color .15s ease}
.nav button:hover{color:var(--bar-ink);background:rgba(255,255,255,.05)}
.nav button[aria-current="page"]{color:var(--bar-ink);background:rgba(255,255,255,.09)}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--or)}
.nav .ico{width:19px;height:19px;flex:0 0 19px}
.nav .nl{flex:1 1 auto;white-space:nowrap}
.side-col{display:flex;align-items:center;gap:12px;margin:8px 10px 14px;padding:9px 12px;background:none;border:1px solid rgba(255,255,255,.12);color:var(--bar-dim);border-radius:9px;cursor:pointer;font-family:var(--f-cond);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:13px}
.side-col:hover{color:var(--bar-ink);border-color:var(--or)}
.side-col .ico{width:18px;height:18px}
body.side-mini .sidenav{flex-basis:68px;width:68px}
body.side-mini .sidenav .nl,body.side-mini .sidenav .bt,body.side-mini .logo-plate{display:none}
body.side-mini .nav button,body.side-mini .side-col{justify-content:center;padding:10px}
body.side-mini .nav .nbadge{position:absolute;top:2px;right:4px}
.navq{padding:2px 2px 8px}.navq input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--bar-ink);border-radius:8px;padding:7px 10px;font-size:13.5px}.navq input::placeholder{color:var(--bar-dim)}.navq input:focus{outline:2px solid var(--or);outline-offset:1px}
.navg{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav .navgh{font-size:11.5px;letter-spacing:.1em;padding:6px 12px 4px;color:var(--bar-dim);opacity:.85;justify-content:space-between}
.nav .navgh::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s ease;margin-right:4px}
.nav .navgh[aria-expanded="true"]::after{transform:rotate(45deg)}
.navsub{display:flex;flex-direction:column;gap:1px;margin:0 0 4px 12px;padding-left:8px;border-left:1px solid rgba(255,255,255,.1)}
.navsub[hidden]{display:none}
.nav .navsub button{font-family:inherit;text-transform:none;letter-spacing:0;font-weight:500;font-size:13.5px;padding:7px 10px;gap:9px}
.nav .navsub .ico{width:15px;height:15px;flex:0 0 15px}
.nav .navsub button[aria-current="true"]{color:var(--bar-ink);background:rgba(255,255,255,.07)}
.nav .navsub .nl{white-space:normal;line-height:1.25}
.nav mark{background:rgba(228,101,14,.35);color:inherit;border-radius:2px}
.navvazio{color:var(--bar-dim);font-size:13px;padding:6px 12px}
body.side-mini .navq,body.side-mini .navgh,body.side-mini .navsub{display:none}
body.side-mini .navg{margin-top:0}
body.side-mini .nav [data-view]{overflow:visible}
body.side-mini .nav [data-view]:hover::after,body.side-mini .nav [data-view]:focus-visible::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:#111;color:#fff;font:500 13px/1.2 var(--f-body,system-ui);letter-spacing:0;text-transform:none;padding:6px 9px;border-radius:6px;white-space:nowrap;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none}
.fpane-off{display:none!important}.modal.drawer{place-items:stretch end;padding:0}.modal.drawer .card{width:min(460px,100vw);height:100%;max-height:100vh;border-radius:0;overflow:auto;animation:none}.objhead{display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;align-items:flex-end;padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid var(--line)}.objhead h2{margin:2px 0}.objtit{font-weight:600;overflow-wrap:anywhere}.objkpis{display:flex;gap:18px;flex-wrap:wrap}.objkpis>div{display:flex;flex-direction:column;gap:2px}.objkpis b{font-size:15px}.fichatabs{margin:-4px 0 10px;position:sticky;top:-1px;z-index:2;background:var(--card,#fff)}.fichaacoes{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:-1px;background:var(--card,#fff);padding:10px 0 2px;border-top:1px solid var(--line);margin-top:12px;z-index:2}
.gbusca .gbq input{width:100%;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.gbres{margin-top:10px;max-height:min(62vh,560px);overflow:auto;display:flex;flex-direction:column;gap:10px}
.gbgh{font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--ink2,#555);margin:2px 0 4px}
.gbi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.gbi[aria-selected="true"]{background:rgba(228,101,14,.08);border-color:rgba(228,101,14,.35)}
.gbico .ico{width:18px;height:18px;color:var(--or)}.gbt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}.gbt b{overflow-wrap:anywhere}
.gbacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:767px){.gbi{flex-wrap:wrap}.gbacts{width:100%;justify-content:flex-start}}
.cpbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);margin:4px 0 8px}.cpbar span{display:block;height:100%}
.cpb-custo{background:#5b6573}.cpb-imp{background:#9aa4b2}.cpb-com{background:#f0b27a}.cpb-mg{background:var(--or)}
.cplegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin-bottom:8px}.cplegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.cpreco tr.tot td{font-weight:700;border-top:1px solid var(--line)}.cpreco tr.sub-t td{color:var(--ink2,#555)}
.lmenu{position:relative;display:inline-block}.lmenu>summary{list-style:none;cursor:pointer}.lmenu>summary::-webkit-details-marker{display:none}
.lpop{position:absolute;right:0;top:calc(100% + 6px);z-index:45;max-height:min(70vh,520px);overflow:auto;background:var(--card,#fff);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:10px 12px;min-width:230px;display:flex;flex-direction:column;gap:6px}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.lhead h2{margin:0}.lacts{display:flex;gap:6px}
.lview{display:flex;justify-content:space-between;gap:10px;align-items:center}
.lpager{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:flex-end;margin-top:10px}
@media (max-width:767px){.lpop{right:auto;left:0}}
.iconbtn.side-x,.iconbtn.menu-btn,.side-scrim{display:none}
.mainw{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.top-in{display:flex;align-items:center;gap:8px 14px;padding:9px 18px;min-height:56px}
.doc-name{font-size:13px;color:var(--bar-dim);min-width:0;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-name b{color:var(--bar-ink);font-weight:600}
.actions{display:flex;gap:6px;flex-wrap:nowrap;margin-left:auto}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:transparent;color:var(--bar-ink);cursor:pointer}
.iconbtn .ico{width:20px;height:20px}
.ico{width:16px;height:16px;flex:0 0 auto;vertical-align:-3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;transition:border-color .15s ease,background .15s ease,box-shadow .15s ease,transform .05s ease}
.btn:hover{border-color:var(--or)}
.btn:active{transform:translateY(1px)}
.btn:disabled,.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.pri{background:var(--or);border-color:var(--or);color:#fff}
.btn.pri:hover{background:var(--or-ink);border-color:var(--or-ink)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.18);color:var(--bar-ink)}
.btn.ghost:hover{border-color:var(--or)}
.hbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}.hbtns .btn{margin:0;white-space:nowrap}
.btn.perd{color:var(--bad);background:transparent;border-color:transparent}.btn.perd:hover{border-color:var(--bad)}
@media (max-width:860px){.hbtns{justify-content:flex-start}}
.btn.busy{pointer-events:none;opacity:.75}
.btn.busy .ico{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.sm .ico{width:14px;height:14px}
@media (max-width:1100px){.actions .btn:not(.pri){font-size:0;gap:0;padding:7px 9px}.actions .btn:not(.pri) .ico{width:18px;height:18px}}
@media (max-width:767px){
  .sidenav{position:fixed;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .2s ease;box-shadow:4px 0 24px rgba(0,0,0,.35)}
  body.side-open .sidenav{transform:none}
  body.side-open .side-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
  .iconbtn.side-x,.iconbtn.menu-btn{display:inline-flex}.side-col{display:none}
  body.side-mini .sidenav{flex-basis:236px;width:236px} body.side-mini .sidenav .nl,body.side-mini .sidenav .bt,body.side-mini .logo-plate{display:revert}
  .top-in{padding:8px 10px;gap:6px}
  .actions{gap:4px}.actions .btn:not(.pri){padding:7px 8px}
  .iconbtn{width:36px;height:36px}
  .actions .btn.pri{padding:7px 11px}
}
/* proposta: cabeçalho de contexto e abas */
.ctxh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;margin:0 0 10px}
.ctx-id{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
.ctx-tt{min-width:0}.ctx-tt h1{margin:0;font-size:24px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctx-kpis{display:flex;align-items:stretch;gap:0;padding:0;overflow:hidden}
.ctx-kpis .k{display:flex;flex-direction:column;justify-content:flex-start;gap:4px;padding:12px 18px;border-left:1px solid var(--line);min-width:112px}
.ctx-kpis .k:first-child{border-left:0}
.ctx-kpis .k span{font-family:var(--f-cond);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.ctx-kpis .k b{font-size:18px;line-height:1.2;white-space:nowrap}
.ctx-kpis .k em{font-style:normal;font-size:11.5px;line-height:1.2;min-height:1.2em;color:var(--ink3);white-space:nowrap}
.ctx-more{display:none;align-self:center;margin:0 8px}
.ctxh .btn.ghost{color:var(--ink2);border-color:var(--line2)}
.ptabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line2);margin:0 0 14px;scrollbar-width:thin}
.ptab{display:inline-flex;align-items:center;gap:7px;padding:9px 12px 10px;border:0;border-bottom:2px solid transparent;background:none;color:var(--ink2);font-family:var(--f-cond);font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;white-space:nowrap;border-radius:8px 8px 0 0;transition:color .15s ease,background .15s ease,border-color .15s ease}
.ptab:hover{color:var(--ink);background:var(--or-soft)}
.ptab.on{color:var(--ink);border-bottom-color:var(--or)}
.ptab .ico{width:17px;height:17px}
.pst{font-style:normal;display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:9px;font-size:11px;font-family:var(--f-body);font-weight:700;padding:0 4px}
.ptab.st-ok .pst{background:var(--ok-bg);color:var(--ok)}.ptab.st-warn .pst{background:var(--warn-bg);color:var(--warn)}.ptab.st-bad .pst{background:var(--bad-bg);color:var(--bad)}.ptab.st-pend .pst{display:none}
.tl{white-space:nowrap}.btn.ic-only .tl{display:none}
.nav .nbadge{margin-left:auto}
.stack > section.card,.card{border-radius:12px}
@media (max-width:860px){
  .ctxh{grid-template-columns:1fr}
  .ctx-kpis .k.x{display:none}.ctxh.open .ctx-kpis .k.x{display:flex}
  .ctx-kpis{flex-wrap:wrap}.ctx-kpis .k{flex:1 1 30%;padding:6px 10px}
  .ctx-more{display:inline-flex}
  .ctx-tt h1{font-size:20px}
  .ptab span{display:none}.ptab.on span{display:inline}
}

/* acabamento moderno (só aparência; nada muda nos dados) */
.card{border-radius:12px;border-color:var(--line)}
.t th{background:var(--th-bg);color:var(--ink2);border-bottom:1px solid var(--line2);font-size:12px;padding:9px 10px}
.t td{padding:7px 10px}
.t tbody tr.click{cursor:pointer}.t tbody tr.click:hover td{background:var(--row-h)}
.f input,.f select,.cellin,.modal input,.modal select,.modal textarea{border-radius:7px;transition:border-color .15s ease,box-shadow .15s ease}
.f input,.f select,.modal input,.modal select{padding:7px 9px}
.f input:focus,.f select:focus,.cellin:focus,.modal input:focus,.modal select:focus,.modal textarea:focus,.t td.in input:focus,.t td.in select:focus,input[type=search]:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px var(--or-soft)}
.kpis{border-radius:12px}
.pill{border-radius:999px}
.banner{border-radius:10px}
.toast{border-radius:10px;animation:toastIn .22s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.modal{animation:fadeIn .15s ease}.modal .card{animation:popIn .18s ease;border-radius:14px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
details>summary{transition:color .15s ease}
.ptabs+*{animation:fadeIn .15s ease}
.savest.ok{animation:fadeIn .3s ease}
.btn .ico+span,.btn .ico+.tl{margin-left:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

main{width:100%;max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
h1,h2,h3{font-family:var(--f-cond);text-wrap:balance;margin:0}
h1{font-size:28px;font-weight:700}
h2{font-size:16px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.sub{color:var(--ink3);font-size:13.5px;max-width:80ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px}
.stack{display:grid;gap:16px;min-width:0}
.stack>*,.split>*,.card{min-width:0}
.card > h2{margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card > h2 .sub{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:400}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--card);padding:12px 14px;display:grid;gap:2px}
.kpi span{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.kpi b{font-family:var(--f-cond);font-weight:700;font-size:26px;line-height:1.1}
.kpi.lead{background:var(--or-soft)}
.kpi.lead b{color:var(--or-ink)}
.kpi em{font-style:normal;font-size:12.5px;color:var(--ink3)}

/* campos */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px 14px}
.fields.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.f{display:grid;gap:3px;min-width:0}
.f > label{min-height:17px;align-items:baseline;font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.02em;display:flex;justify-content:space-between;gap:6px}
.f .ctl{display:flex;min-width:0}
.f input,.f select,.cellin{width:100%;min-width:0;border:1px solid var(--entry-line);background:var(--entry);border-radius:6px;padding:6px 8px;font-size:14px}
