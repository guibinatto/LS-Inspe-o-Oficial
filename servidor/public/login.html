<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LS Fire · Entrar</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
  /* mesmo design do LS Pricer */
  :root { --or:#E8570A; --or-soft:#FFF1E8; --ink:#1B1C1E; --ink2:#4E5157; --ink3:#83868C; --line:#E4E2DE; --line2:#D2CFC9; --bg:#F4F3F0; --card:#FFFFFF; --bar:#1E1F21; --bar-ink:#F1EFEA; --bar-dim:#9C9EA3; --bad:#B42F22; --bad-bg:#FCEBE8;
    --shadow:0 1px 2px rgba(30,20,10,.06),0 2px 8px rgba(30,20,10,.05); --f-body:"Barlow",Arial,Helvetica,sans-serif; --f-cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme:dark; --or:#FF7A33; --or-soft:#3A2418; --ink:#ECEAE6; --ink2:#B9B6B0; --ink3:#8A8781; --line:#34332F; --line2:#46443F; --bg:#161615; --card:#1F1F1D; --bar:#0E0E0D; --bad:#FF8A7A; --bad-bg:#3A1B17; --shadow:0 1px 2px rgba(0,0,0,.4); } }
  :root[data-theme="dark"] { color-scheme:dark; --or:#FF7A33; --or-soft:#3A2418; --ink:#ECEAE6; --ink2:#B9B6B0; --ink3:#8A8781; --line:#34332F; --line2:#46443F; --bg:#161615; --card:#1F1F1D; --bar:#0E0E0D; --bad:#FF8A7A; --bad-bg:#3A1B17; --shadow:0 1px 2px rgba(0,0,0,.4); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); }
  .card { width: 100%; max-width: 390px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .marca { background: var(--bar); padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .marca img { height: 34px; width: auto; display: block; }
  .marca span { font-family: var(--f-cond); font-weight: 700; font-size: 20px; letter-spacing: .02em; color: var(--or); }
  form { padding: 22px; }
  h1 { font-family: var(--f-cond); font-weight: 700; font-size: 22px; letter-spacing: .01em; margin: 0 0 2px; }
  p.sub { margin: 0 0 16px; color: var(--ink3); font-size: 13.5px; }
  label { display: block; font-family: var(--f-cond); font-size: 13px; font-weight: 600; margin: 12px 0 5px; color: var(--ink2); text-transform: uppercase; letter-spacing: .06em; }
  input { width: 100%; padding: 10px 12px; font: 16px var(--f-body); border: 1px solid var(--line2); border-radius: 8px; background: var(--card); color: var(--ink); }
  input:focus { outline: 2px solid var(--or); outline-offset: 0; border-color: var(--or); }
  button { width: 100%; margin-top: 18px; padding: 11px; font: 600 15px var(--f-body); color: #fff; background: var(--or); border: 1px solid var(--or); border-radius: 8px; cursor: pointer; }
  button:hover { filter: brightness(1.05); }
  button:disabled { opacity: .6; cursor: wait; }
  .erro { color: var(--bad); font-size: 13.5px; margin-top: 12px; min-height: 18px; }
  .rodape { padding: 12px 22px 16px; font-family: var(--f-cond); font-weight: 700; font-size: 12px; letter-spacing: .08em; color: var(--or); text-align: center; border-top: 1px solid var(--line); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <div class="marca"><img src="/logo-lsfire-escuro.png" alt="LS Fire" width="92" height="34"><span>Pricer · Serviço</span></div>
  <form id="fEntrar">
    <h1>Entrar</h1>
    <p class="sub">LS Pricer e Serviço de campo</p>
    <label for="login">Login</label><input id="login" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required>
    <button id="bEntrar">Entrar</button>
    <div class="erro" id="eEntrar" role="alert"></div>
  </form>
  <form id="fTroca" hidden>
    <h1>Troque a sua senha</h1>
    <p class="sub">É o primeiro acesso (ou a senha foi redefinida pelo administrador). Use pelo menos 8 caracteres, com letras e números.</p>
    <label for="nova">Senha nova</label><input id="nova" type="password" autocomplete="new-password" required minlength="8">
    <label for="nova2">Repita a senha nova</label><input id="nova2" type="password" autocomplete="new-password" required minlength="8">
    <button id="bTroca">Salvar e continuar</button>
    <div class="erro" id="eTroca" role="alert"></div>
  </form>
  <div class="rodape">A FORÇA DA ÁGUA É A NOSSA FORÇA</div>
</main>
<script>
try { var t = localStorage.getItem("lspricer.tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
(function () {
  var qs = new URLSearchParams(location.search);
  var volta = qs.get('volta') || '';
  if (!/^\/[A-Za-z0-9_\-\/.?=&#%]*$/.test(volta) || volta.indexOf('//') === 0) volta = '';
  if (qs.get('troca')) document.getElementById('eEntrar').textContent = 'Entre de novo para trocar a senha provisória.';
  if (qs.get('semacesso')) document.getElementById('eEntrar').textContent = 'Seu usuário não tem acesso liberado. Fale com o administrador.';
  var senhaAtual = '', me = null;
  function api(url, corpo) {
    return fetch(url, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-LSF': '1' }, body: JSON.stringify(corpo || {}) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || ('Erro ' + r.status)); return j; }); });
  }
  function seguir() {
    var destino = me && me.nivelPricer >= 1 ? (volta || '/') : '/servico/';
    if (me && me.nivelPricer < 1 && volta.indexOf('/servico') === 0) destino = volta;
    location.replace(destino);
  }
  document.getElementById('fEntrar').addEventListener('submit', function (e) {
    e.preventDefault(); var b = document.getElementById('bEntrar'), er = document.getElementById('eEntrar'); er.textContent = ''; b.disabled = true;
    senhaAtual = document.getElementById('senha').value;
    api('/api/login', { login: document.getElementById('login').value, senha: senhaAtual }).then(function (j) {
      me = j.me;
      if (me.trocarSenha) { document.getElementById('fEntrar').hidden = true; document.getElementById('fTroca').hidden = false; document.getElementById('nova').focus(); return; }
      seguir();
    }).catch(function (x) { er.textContent = x.message; }).finally(function () { b.disabled = false; });
  });
  document.getElementById('fTroca').addEventListener('submit', function (e) {
    e.preventDefault(); var b = document.getElementById('bTroca'), er = document.getElementById('eTroca'); er.textContent = '';
    var n = document.getElementById('nova').value;
    if (n !== document.getElementById('nova2').value) { er.textContent = 'As duas senhas não são iguais.'; return; }
    b.disabled = true;
    api('/api/senha', { atual: senhaAtual, nova: n }).then(seguir).catch(function (x) { er.textContent = x.message; }).finally(function () { b.disabled = false; });
  });
  document.getElementById('login').focus();
})();
</script>
</body>
</html>
